<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Interactive Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-app">
        
        <!-- Calculator Display Area -->
        <div class="calculator-display">
            <div class="history" id="history"></div>
            <div class="current-input" id="current-input">0</div>
        </div>

        <!-- Calculator Buttons Area -->
        <div class="calculator-keys">
            <!-- Row 1: Utilities -->
            <button class="key utility" data-action="clear">AC</button>
            <button class="key utility" data-action="delete">DEL</button>
            <button class="key utility" data-action="percent">%</button>
            <button class="key operator" data-action="divide">÷</button>

            <!-- Row 2: Numbers 7, 8, 9 and Multiply -->
            <button class="key number" data-action="7">7</button>
            <button class="key number" data-action="8">8</button>
            <button class="key number" data-action="9">9</button>
            <button class="key operator" data-action="multiply">×</button>

            <!-- Row 3: Numbers 4, 5, 6 and Subtract -->
            <button class="key number" data-action="4">4</button>
            <button class="key number" data-action="5">5</button>
            <button class="key number" data-action="6">6</button>
            <button class="key operator" data-action="subtract">-</button>

            <!-- Row 4: Numbers 1, 2, 3 and Add -->
            <button class="key number" data-action="1">1</button>
            <button class="key number" data-action="2">2</button>
            <button class="key number" data-action="3">3</button>
            <button class="key operator" data-action="add">+</button>

            <!-- Row 5: 0, Decimal, Equals -->
            <button class="key number zero" data-action="0">0</button>
            <button class="key number" data-action=".">.</button>
            <button class="key equals" data-action="calculate">=</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
